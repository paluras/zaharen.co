<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" href="/logo.svg" />
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="
    default-src 'self' https://*.sanity.io https://*.vercel.app https://*.vercel.com;
    connect-src 'self' https://*.sanity.io https://*.apicdn.sanity.io https://*.api.sanity.io https://*.vercel.app https://*.vercel.com https://*.facebook.com https://facebook.com;
    style-src 'self' 'unsafe-inline';
    script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.vercel.live https://*.vercel.app https://*.vercel.com https://*.facebook.net https://connect.facebook.net;
    img-src 'self' https://*.sanity.io https://*.vercel.app https://*.vercel.com https://raw.githubusercontent.com https://*.githubusercontent.com https://github.com https://*.facebook.com https://facebook.com data: blob:;
    font-src 'self' data:;
    frame-src 'self' https://www.youtube.com https://youtube.com https://www.youtube-nocookie.com https://youtu.be https://drive.google.com https://*.google.com https://open.spotify.com;
    object-src 'none';
    base-uri 'self';
    form-action 'self'
  "
    />
    <script>
      (function () {
        var path = window.location.pathname;
        var fonts = [];
        if (/^\/condition2(\/(en|ro))?\/?$/.test(path)) {
          fonts = [
            "/fonts/epk/anton-latin-400-normal.woff2",
            "/fonts/epk/anton-latin-ext-400-normal.woff2",
            "/fonts/epk/archivo-latin-400-normal.woff2",
            "/fonts/epk/archivo-latin-ext-400-normal.woff2",
          ];
        } else if (/^\/epk(\/(en|ro))?\/?$/.test(path)) {
          fonts = [
            "/fonts/epk-album/archivo-var-latin.woff2",
            "/fonts/epk-album/archivo-var-latin-ext.woff2",
            "/fonts/epk-album/ibm-plex-mono-400-latin.woff2",
          ];
          // The album cover is the largest thing on screen; start it before the page chunk loads.
          var cover = document.createElement("link");
          cover.rel = "preload";
          cover.as = "image";
          cover.type = "image/webp";
          cover.setAttribute("imagesrcset", "/epk/album/cover-700.webp 700w, /epk/album/cover-1400.webp 1400w");
          cover.setAttribute("imagesizes", "(min-width: 760px) 50vw, 100vw");
          cover.setAttribute("fetchpriority", "high");
          document.head.appendChild(cover);
        }
        fonts.forEach(function (href) {
          var preload = document.createElement("link");
          preload.rel = "preload";
          preload.as = "font";
          preload.type = "font/woff2";
          preload.href = href;
          preload.crossOrigin = "anonymous";
          document.head.appendChild(preload);
        });
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "http://schema.org",
        "@type": "Organization",
        "name": "Zaharenco",
        "url": "https://www.zaharen.co/",
        "logo": "https://www.zaharen.co/Zaharenco-logo.png",
        "image": "https://www.zaharen.co/about-media/ZAH%20(5).jpg",
        "description": "Experience the artistic realm of Alexandru Zaharencu. Discover his captivating music, compelling compositions, and mesmerizing multimedia creations. From jazz to contemporary, film scores to interactive installations, his diverse talent knows no boundaries.Welcome to a world where imagination and innovation intertwine."
      }
    </script>

    <meta
      name="description"
      content="Experience the artistic realm of Alexandru Zaharencu. Discover his captivating music, compelling compositions, and mesmerizing multimedia creations.

      From jazz to contemporary, film scores to interactive installations, his diverse talent knows no boundaries.

      Welcome to a world where imagination and innovation intertwine."
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Zaharenco</title>
  </head>

  </body>
